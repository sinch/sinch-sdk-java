# Each setting can also be set as an environment variable, which wins over this file

# Sinch credentials (from dashboard.sinch.com -> Access Keys)
SINCH_PROJECT_ID=
SINCH_KEY_ID=
SINCH_KEY_SECRET=

# Your Sinch virtual number, in E.164 format (e.g. +14045001000)
SINCH_NUMBER=
# The number to call with TrackSession, in E.164 format (e.g. +14155551234)
DESTINATION_NUMBER=

# Local server port (server)
PORT=3000
