# Each setting can also be set as an environment variable, which wins over this file

# Sinch credentials (from dashboard.sinch.com -> Access Keys)
SINCH_PROJECT_ID=
SINCH_KEY_ID=
SINCH_KEY_SECRET=

# Your Sinch virtual number, in E.164 format (e.g. +14045001000)
SINCH_NUMBER=
# The number to call with TriggerCall, in E.164 format (e.g. +14155551234)
DESTINATION_NUMBER=

# Bucket path where recordings are uploaded. The storage provider is inferred from the scheme:
# s3:// -> AWS, gs:// -> GCP, anything else (e.g. https://<account>.blob.core.windows.net/...) -> AZURE
STORAGE_DESTINATION_URL=
# Storage credentials. For AWS: ACCESS_KEY:SECRET_KEY:REGION
STORAGE_CREDENTIALS=

# Local server port (server)
PORT=8081

# Optional, for the server: the service that owns your Sinch number and its secret.
# When set, the server rejects any request not signed with that secret
SINCH_SERVICE_ID=
SINCH_SERVICE_SECRET=
