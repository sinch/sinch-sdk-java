# CI for the internal Java SDK repository on GitLab.
# Public CI (including CodeQL and dependency review), Maven Central releases and
# documentation upload stay on GitHub (.github/workflows), in the public
# repository sinch/sinch-sdk-java.
#
# CI/CD variables (set on the sdks group unless noted):
#   MOCKSERVER_REPO_TOKEN        Read-only GitHub token for sinch/sinch-sdk-mockserver   (masked, hidden; not protected). Only used by e2e-tests, which is disabled for now
#   GITHUB_SYNC_APP_CLIENT_ID    Client ID of the sinch-internal-repo-sync-bot GitHub App (protected)
#   GITHUB_SYNC_APP_PRIVATE_KEY  Private key of that App                                 (File, protected)
#   GITLAB_SYNC_TOKEN            Project variable. Project access token, Maintainer, write_repository (masked, hidden, protected)
#
# Pipelines:
#   push to any branch          build (Java 21) and examples (Java 21 and 25)
#   push to a protected branch  also sync-to-public if the commit is an MR merge.
#                               Protected: main, V*, release-*, feat/*-next, feat/*-patch
#   SYNC_FROM_PUBLIC == "true"  sync-from-public only. Set by the nightly schedule and
#                               by the trigger in the public repo (notify-private-repo.yml)

workflow:
  rules:
    # Branch pipelines only, like "on: push" on GitHub. MR pipelines would run
    # the build twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

default:
  tags: [default]

variables:
  SDK_NAME: sinch-sdk-java
  PUBLIC_REPO: sinch/sinch-sdk-java
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

stages:
  - build
  - sync

.maven:
  image: maven:3.9-eclipse-temurin-$JAVA_VERSION
  cache:
    key: maven-$JAVA_VERSION
    paths: [.m2/repository/]
  rules:
    - if: $SYNC_FROM_PUBLIC == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"

# Replaces the "build" job of .github/workflows/build.yml.
# DEVEXP-1592 (temporary workaround): only Java 21 is built for now.
# TODO: restore 8, 11, 17 and 25, using the Maven arguments kept in build.yml.
build:
  stage: build
  extends: .maven
  timeout: 20m
  parallel:
    matrix:
      - JAVA_VERSION: "21"
        MAVEN_ARGS: clean package javadoc:javadoc
  script:
    - mvn -B -DskipITs $MAVEN_ARGS --file pom.xml

# Replaces the "e2e-tests" job of .github/workflows/build.yml.
# DEVEXP-1592 (temporary workaround): E2E tests are disabled for every Java version.
# TODO: remove the first rule to re-enable them.
e2e-tests:
  stage: build
  extends: .maven
  needs: [build]
  parallel:
    matrix:
      - JAVA_VERSION: ["8", "11", "17", "21", "25"]
  rules:
    - when: never
  script:
    - ': "${MOCKSERVER_REPO_TOKEN:?Set MOCKSERVER_REPO_TOKEN in Settings > CI/CD > Variables}"'
    - git clone "https://x-access-token:${MOCKSERVER_REPO_TOKEN}@github.com/sinch/sinch-sdk-mockserver.git" sinch-sdk-mockserver
    - ln -s "$CI_PROJECT_DIR/sinch-sdk-mockserver/features" client/src/test/resources
    - mvn -B -DskipUTs -Dspotless.check.skip=true verify --file pom.xml

# Replaces .github/workflows/samples-compilation.yaml.
examples:
  stage: build
  extends: .maven
  timeout: 30m
  parallel:
    matrix:
      - JAVA_VERSION: ["21", "25"]
  script:
    - mvn -B clean install -DskipTests=true -Dspotless.check.skip=true -DskipUTs -DskipITs --file pom.xml
    - cd examples
    - ./compile.sh

# Replaces .github/workflows/sync-to-public.yml. When an MR is merged, push the
# target branch to the public repository. GitLab has no "MR merged" event, so
# the rule matches the merge commit, whose message always contains
# "See merge request". Commits pushed by the sync bot are skipped, so changes
# that came from the public repo are not pushed back.
# Only protected branches are synced, because the App key is a protected
# variable that pipelines on other branches cannot read.
sync-to-public:
  stage: sync
  image: alpine:3.20
  needs: []
  resource_group: sync-to-public-$CI_COMMIT_BRANCH
  rules:
    - if: $SYNC_FROM_PUBLIC == "true"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_MESSAGE =~ /See merge request / && $GITLAB_USER_LOGIN !~ /^project_\d+_bot/
    # Manual recovery: Run pipeline on a protected branch with SYNC_TO_PUBLIC=true.
    - if: $CI_PIPELINE_SOURCE == "web" && $SYNC_TO_PUBLIC == "true"
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git curl jq openssl
  script:
    - TOKEN=$(sh .gitlab/scripts/github-app-token.sh sinch "$SDK_NAME")
    - echo "Syncing $CI_COMMIT_BRANCH ($CI_COMMIT_SHORT_SHA) to $PUBLIC_REPO"
    # No force push, so public history is never overwritten if the repos diverge.
    - git push "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" "${CI_COMMIT_SHA}:refs/heads/${CI_COMMIT_BRANCH}"

# Replaces .github/workflows/sync-from-public.yml. Copies every branch and tag
# from the public repository into this one.
sync-from-public:
  stage: sync
  image: alpine:3.20
  needs: []
  resource_group: sync-from-public
  rules:
    - if: $SYNC_FROM_PUBLIC == "true"
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache git
  script:
    - ': "${GITLAB_SYNC_TOKEN:?Set GITLAB_SYNC_TOKEN in Settings > CI/CD > Variables}"'
    - rm -rf public_repo
    - git clone --bare "https://github.com/${PUBLIC_REPO}.git" public_repo
    - cd public_repo
    - git push --all "https://oauth2:${GITLAB_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push --tags "https://oauth2:${GITLAB_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
